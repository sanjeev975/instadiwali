<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Diwali Dock</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Noto+Sans+Devanagari:wght@500&display=swap" rel="stylesheet">
<style>
:root{--b0:#070414;--b1:#220b18;--ink:#fde9c0;--gl:rgba(255,255,255,.08);--rim:rgba(255,215,140,.4);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--b0:#060312;--b1:#1d0a15}}
:root[data-theme="dark"]{--b0:#060312;--b1:#1d0a15}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;overflow:hidden;color:var(--ink);font:500 14px system-ui,-apple-system,sans-serif;background:radial-gradient(900px 500px at 50% 105%,rgba(255,120,30,.25),transparent 70%),linear-gradient(var(--b0),var(--b1));user-select:none;-webkit-user-select:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.bk{position:fixed;z-index:0;border-radius:50%;filter:blur(18px);opacity:.22;animation:fl 14s ease-in-out infinite alternate}
@keyframes fl{to{transform:translate3d(30px,-60px,0)}}
.wrap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;z-index:2;pointer-events:none}
.dock{pointer-events:auto;display:flex;gap:clamp(6px,2vw,14px);padding:clamp(8px,2vw,12px);border-radius:999px;background:var(--gl);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 var(--rim),inset 0 -1px 0 rgba(255,255,255,.05),0 20px 60px rgba(0,0,0,.55),0 0 50px rgba(255,150,40,.15);transition:transform 1.6s cubic-bezier(.2,.8,.2,1)}
body.fin .dock{transform:translate3d(0,34vh,0)}
.hint{opacity:.55;letter-spacing:.06em;font-size:13px;transition:opacity 1s}
body.go .hint{opacity:0}
.b{position:relative;width:clamp(44px,13vw,60px);aspect-ratio:1;border:0;border-radius:50%;background:transparent;color:var(--ink);cursor:pointer;display:grid;place-items:center;touch-action:manipulation;will-change:transform;transition:transform .25s cubic-bezier(.3,1.5,.5,1),background .25s,box-shadow .25s,color .25s}
.b svg{width:56%;height:56%;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .5s,opacity .4s}
.b:hover{transform:scale(1.14);background:rgba(255,200,100,.12);box-shadow:0 0 22px rgba(255,190,80,.55),inset 0 0 12px rgba(255,210,120,.25);color:#fff3cf}
.b:active{transform:scale(.92)}
.b:focus-visible,#mute:focus-visible,#rst:focus-visible{outline:2px solid #ffd27a;outline-offset:2px}
.b.u{pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,210,120,.22)}
.b.u svg{opacity:0;transform:scale(.3) rotate(40deg)}
.tl{position:fixed;left:16px;top:calc(22px + env(safe-area-inset-top,0px));z-index:6;font-size:13px;opacity:.7;letter-spacing:.05em}
#mute{position:fixed;right:16px;top:calc(12px + env(safe-area-inset-top,0px));z-index:6;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:var(--gl);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);cursor:pointer;display:grid;place-items:center}
#mute svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#mute .x{display:none}#mute[aria-pressed="true"] .w{display:none}#mute[aria-pressed="true"] .x{display:block}
#rst{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:6;transform:translate3d(-50%,20px,0);opacity:0;pointer-events:none;padding:10px 22px;border-radius:999px;border:1px solid rgba(255,215,140,.35);background:var(--gl);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);font:inherit;cursor:pointer;transition:opacity .5s,transform .5s}
#rst.show{opacity:1;transform:translate3d(-50%,0,0);pointer-events:auto}
.obj{position:fixed;left:0;top:0;width:80px;height:80px;z-index:5;pointer-events:none;will-change:transform,opacity}
.obj .l{position:absolute;inset:0;display:grid;place-items:center;transition:opacity var(--d,.7s),transform var(--d,.9s) cubic-bezier(.2,.8,.2,1)}
.obj .ic svg{width:48px;height:48px;fill:none;stroke:#ffe3a6;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px #ffb347)}
.obj .cr{opacity:0;transform:scale(.3) rotate(-50deg)}
.obj.m .ic{opacity:0;transform:scale(1.7) rotate(45deg)}
.obj.m .cr{opacity:1;transform:none}
.obj .cr svg{position:absolute;inset:0;width:80px;height:80px;filter:drop-shadow(0 0 8px rgba(255,170,60,.6))}
.s1{transition:opacity 1.4s}.s2{opacity:0;transition:opacity 1.4s}
.obj.m2 .s1{opacity:0}.obj.m2 .s2{opacity:1}
.obj.done .s2{animation:sp 40s linear infinite}
.wk{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0);transition:transform .5s .6s}.obj.m .wk{transform:none}
.wave{position:fixed;left:0;top:0;width:60px;height:60px;margin:-30px;border-radius:50%;border:3px solid rgba(255,225,150,.9);box-shadow:0 0 40px 10px rgba(255,190,80,.6),inset 0 0 40px rgba(255,200,100,.5);z-index:4;pointer-events:none;animation:wv 2.2s cubic-bezier(.1,.7,.2,1) forwards}
@keyframes wv{from{transform:var(--p) scale(.2);opacity:1}to{transform:var(--p) scale(30);opacity:0}}
#rays{position:fixed;left:50%;top:24%;width:130vmax;height:130vmax;margin:-65vmax 0 0 -65vmax;z-index:1;pointer-events:none;opacity:0;transition:opacity 3s;background:repeating-conic-gradient(rgba(255,205,100,.2) 0 5deg,transparent 5deg 15deg);-webkit-mask:radial-gradient(circle,#000,transparent 45%);mask:radial-gradient(circle,#000,transparent 45%);animation:sp 90s linear infinite;will-change:transform}
#rays.on{opacity:1;animation:sp 90s linear infinite,br 5s ease-in-out infinite alternate}
@keyframes sp{to{transform:rotate(360deg)}}@keyframes br{from{opacity:.5}to{opacity:1}}
#rays.on{transition:none}
#greet{position:fixed;left:0;right:0;top:42%;padding:0 12px;text-align:center;z-index:4;pointer-events:none;opacity:0;transform:translate3d(0,24px,0) scale(.92);filter:blur(12px);transition:opacity 2.4s,transform 2.4s cubic-bezier(.2,.8,.2,1),filter 2.4s}
#greet.on{opacity:1;transform:none;filter:none}
#greet h1{margin:0;font:italic 600 clamp(34px,9.5vw,92px)/1.1 'Playfair Display',Georgia,serif;display:flex;gap:.3em;justify-content:center;align-items:center;flex-wrap:wrap}
#greet b{font-weight:600;background:linear-gradient(100deg,#fff3c4,#ffc24a 40%,#fff3c4 60%,#e89a2a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 6s linear infinite;padding:0 .1em}
@keyframes sh{to{background-position:-200% 0}}
#greet i{font-style:normal;animation:tw 2s ease-in-out infinite alternate}
@keyframes tw{to{transform:scale(1.25) rotate(12deg);opacity:.7}}
#greet p{margin:.4em 0 0;font:500 clamp(22px,5.5vw,44px) 'Noto Sans Devanagari',system-ui,sans-serif;color:#ffd98a;letter-spacing:.06em;text-shadow:0 0 22px rgba(255,160,40,.7)}
@media(prefers-reduced-motion:reduce){.bk,#greet b,#greet i{animation:none}}
.b{pointer-events:none;cursor:default}
.b.act{transform:scale(1.14);background:rgba(255,200,100,.14);box-shadow:0 0 24px rgba(255,190,80,.6),inset 0 0 12px rgba(255,210,120,.3)}
#rst{display:none}
body.snd .hint,body.fin .hint,body.rl .hint{opacity:0}
body.rl .dock{transform:translate3d(0,34vh,0)}
#stage{position:fixed;inset:0;z-index:2;pointer-events:none;display:flex;justify-content:center;align-items:flex-start;padding-top:calc(5vh + env(safe-area-inset-top,0px));opacity:0;transition:opacity 1s}
#stage.on{opacity:1}
.fr{position:relative;width:min(72vh,92vw)}
.aura{position:absolute;inset:-18%;border-radius:50%;background:radial-gradient(circle,rgba(255,190,90,.7),rgba(255,120,30,.22) 42%,transparent 68%);opacity:0;transform:scale(.5);transition:opacity 2.5s ease,transform 7s cubic-bezier(.22,.6,.36,1)}
#stage.on .aura{opacity:1;transform:scale(1.15)}
#ram{position:relative;display:block;width:100%;height:auto;opacity:0;transform:scale(.9) translate3d(0,14px,0);filter:blur(18px) brightness(1.5) drop-shadow(0 0 0 rgba(255,170,60,0));clip-path:circle(0% at 50% 45%);will-change:transform,opacity,filter,clip-path;transition:opacity 2.6s cubic-bezier(.16,1,.3,1),filter 3.2s cubic-bezier(.16,1,.3,1),clip-path 3.2s cubic-bezier(.16,1,.3,1),transform 7s cubic-bezier(.22,.6,.36,1)}
#stage.on #ram{opacity:1;transform:scale(1.1) translate3d(0,0,0);filter:blur(0) brightness(1) drop-shadow(0 0 24px rgba(255,170,60,.45));clip-path:circle(75% at 50% 45%)}
#stage.on.out{opacity:0}
#stage.on.out #ram{opacity:0;transform:scale(1.16);filter:blur(10px) brightness(1.2) drop-shadow(0 0 0 rgba(255,170,60,0));transition:opacity .8s ease-in,filter .8s,transform .8s}
</style></head><body>
